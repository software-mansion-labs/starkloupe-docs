server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Every route is a directory with its own index.html - $uri/ resolves
    # /getting-started/ to /getting-started/index.html. Anything unmatched
    # falls through to Docusaurus's own generated 404 page.
    location / {
        try_files $uri $uri/ /404.html;
    }

    # Fingerprinted (hashed filename), so a far-future cache is safe: a
    # content change ships under a new filename, never invalidates in place.
    # This is also what the load balancer's CDN policy (USE_ORIGIN_HEADERS,
    # in docs_loadbalancer.tf) keys off of.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    error_page 404 /404.html;
}
