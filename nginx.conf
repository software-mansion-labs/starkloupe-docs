server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # trailingSlash is false, so Docusaurus emits flat files (e.g.
    # debugging/call-traces.html) and links to them without the extension.
    # $uri.html resolves those; $uri/ still covers the homepage's index.html.
    # =404 (not a /404.html URI) forces a real 404 status instead of an
    # internal redirect that would serve the error page as a 200.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Fingerprinted (hashed filename), so a far-future cache is safe: a
    # content change ships under a new filename, never invalidates in place.
    # This is also what the load balancer's CDN policy (USE_ORIGIN_HEADERS,
    # in docs_loadbalancer.tf) keys off of.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    error_page 404 /404.html;
}
